<svg xmlns="http://www.w3.org/2000/svg" width="860" height="96" viewBox="0 0 860 96" role="img" aria-label="On GitHub">
<title>On GitHub</title>
<style>@font-face{font-family:'Martian Mono';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Instrument Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.u{transform-origin:2px 0;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#8ea2ff"/><stop offset="1" stop-color="#ffb86b"/></linearGradient></defs>
<text x="2" y="14" font-family="'JetBrains Mono',monospace" font-size="12" fill="#6c789c">03 /</text>
<text x="0" y="48" font-family="'Martian Mono',monospace" font-weight="600" font-size="27" letter-spacing="-1" fill="#e8edff">On GitHub</text>
<rect x="2" y="60" width="56" height="2" rx="1" fill="url(#ul)"/>
<text x="2" y="88" font-family="'Instrument Sans',sans-serif" font-size="15" fill="#a3aed0">Updated every night by a GitHub Action.</text>
</svg>