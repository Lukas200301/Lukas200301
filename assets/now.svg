<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" viewBox="0 0 410 210" role="img" aria-label="lsh now: live status from Discord">
<title>now</title>
<style>@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;white-space:pre}
.caret{animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.live{animation:live 2s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="c"><rect width="410" height="210" rx="18"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="410" height="210" fill="#0c1222"/>
<rect width="410" height="36" fill="#121a2f"/>
<line x1="0" y1="36.5" x2="410" y2="36.5" stroke="#1a2440"/>
<circle cx="20" cy="18" r="5" fill="#ff7a90"/><circle cx="36" cy="18" r="5" fill="#ffb86b"/><circle cx="52" cy="18" r="5" fill="#5ee6b5"/>
<text x="225.0" y="22" text-anchor="middle" class="m" font-size="11.5" fill="#6c789c">guest@lukas200301: ~ — lsh</text>
<text x="22" y="70" class="m"><tspan fill="#5ee6b5">guest@lukas200301</tspan><tspan fill="#8ea2ff"> ~ $ </tspan><tspan fill="#e8edff">now</tspan><tspan class="caret" fill="#8ea2ff">_</tspan></text>
<circle class="live" cx="382" cy="66" r="4" fill="#5ee6b5"/>
<text x="22" y="104" class="m"><tspan fill="#6c789c">listening </tspan><tspan fill="#8ea2ff">→ </tspan><tspan fill="#e8edff">Spotify, live</tspan></text><text x="22" y="126" class="m"><tspan fill="#6c789c">coding    </tspan><tspan fill="#8ea2ff">→ </tspan><tspan fill="#e8edff">VS Code &amp; co, live</tspan></text><text x="22" y="148" class="m"><tspan fill="#6c789c">playing   </tspan><tspan fill="#8ea2ff">→ </tspan><tspan fill="#e8edff">whatever is open</tspan></text><text x="22" y="176" class="m" fill="#6c789c" font-style="italic"># same feed as the pill on my site.</text><text x="22" y="195" class="m" fill="#6c789c" font-style="italic"># press ` there for the full shell.</text>
</g>
